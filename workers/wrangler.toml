name = "muse-mailbox"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Your Cloudflare account id (find it in the dashboard sidebar).
account_id = "<your-cloudflare-account-id>"
workers_dev = true

# Guest model: the relay runs on the operator's own Cloudflare account.
# Anyone can deploy their own relay — the protocol is standardized, so
# clients work against any compliant relay. See docs/INVESTIGATION.md.

[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "MailboxDO"

[[migrations]]
tag = "v1"
new_classes = ["MailboxDO"]

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "muse-mailbox-blobs"

# Set via `wrangler secret put ADMIN_SECRET` (32 random bytes, never committed).
# [vars] stays empty on purpose.
